# Build manifest only, never `compose up`. Build all nine images with:
#   docker compose -f evals/docker/compose.yml build
# The benchmark runner launches each server with `docker run -i`, not compose.
# Nine images cover the four targets (five CVEs) on both versions: filesystem serves
# CVE-2025-53109 + 53110 (one merged target) and git serves CVE-2025-68143 (one target),
# each with its patched twin, plus kubernetes, fetch and the sentinel sidecar. The sentinel
# has no patched twin: it is not a server image.
# Each service carries the label org.mcp-auditor.dockerfile-fingerprint, the SHA-256 of its
# Dockerfile's instructions (comments and blank lines left out), so a tag holding another build
# is told apart and rebuilt. After a Dockerfile edit, tests/unit/test_cve_compose_labels.py
# prints the value to paste.
# The holdout server images are appended after the sentinel, two per transplanted target
# (vulnerable and patched), named holdout-<year>-<num>-<service>; the same build command builds
# them. SSRF holdout targets reuse the shared sentinel above, adding no sentinel of their own.
services:
  filesystem:
    build:
      context: .
      dockerfile: Dockerfile.filesystem
      labels:
        org.mcp-auditor.dockerfile-fingerprint: "89bdd635f9137dc69ea37463d3e2c869fbf2961c6b8d56a2b07bafc7bc041226"
    image: mcp-auditor-cve-filesystem:local

