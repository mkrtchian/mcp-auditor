      labels:
        org.mcp-auditor.dockerfile-fingerprint: "5232c6f72c89f6d73ab4b21c64bc7705736600c5833daeff81485e63f4c909a9"
    image: mcp-auditor-cve-git:local

  git-patched-68143:
