# Build manifest only, never `compose up`. Build all nine images with:
#   docker compose -f evals/docker/compose.yml build
# The detection suite launches each server with `docker run -i`, not compose.
# Nine images cover the four acceptance targets (five flaws) on both versions: filesystem serves
# CVE-2025-53109 + 53110 (one merged target) and git serves CVE-2025-68143 (one target),
# each with its patched image, plus kubernetes, fetch and the sentinel sidecar. The sentinel
# has no patched image: it is not a server image.
# Each service carries the label org.mcp-auditor.dockerfile-fingerprint, the SHA-256 of its
# Dockerfile's instructions (comments and blank lines left out), so a tag holding another build
# is told apart and rebuilt. After a Dockerfile edit, tests/unit/cve/test_cve_compose_labels.py
# prints the value to paste.
# The images of the holdout targets are appended after the sentinel, two per transplanted target
# (vulnerable and patched), named holdout-<year>-<num>-<service>; the same build command builds
# them. SSRF holdout targets reuse the shared sentinel above, adding no sentinel of their own.
# The nuisance block closes the file: one patched image per admitted server, tagged
# mcp-auditor-nuisance-<service>:local, then the backend images the fixtures build (the
# responders, the CKAN stack and the n8n instance) under their backend modules' tags. Its services
# carry the nuisance profile, so the build command above leaves them out, while the nuisance run
# names its services and Compose enables the profile of a named service. Build the whole block
# by hand with:
#   docker compose -f evals/docker/compose.yml --profile nuisance build
