[project]
name = "mcp-auditor"
version = "0.5.0"
description = "Agentic security testing for MCP servers"
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Roman Mkrtchian", email = "mkrtchia@gmail.com" }]
keywords = ["mcp", "security", "fuzzing", "audit", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "langgraph>=1.0",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-core>=1.7.0",
    "mcp>=1.18.0,<2",
    "pydantic>=2.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "click>=8.1",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "langchain-openai>=1.6.7",
    "langchain-fireworks>=1.7.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/mkrtchian/mcp-auditor"
Repository = "https://github.com/mkrtchian/mcp-auditor"
Issues = "https://github.com/mkrtchian/mcp-auditor/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "pyrefly>=1.5",
    "types-PyYAML",
    "langsmith>=0.3",
    "pytest-xdist>=3.8.0",
    "cryptography>=50.0.2",
    "hatch-fancy-pypi-readme==25.1.0",
]

[project.scripts]
mcp-auditor = "mcp_auditor.cli:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auditor"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# The README's links stay relative for GitHub and a checkout. PyPI resolves no relative path, so
# the build points each at the release tag, which is `v` plus the version. In-page anchors work there.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()(?!https?://|#)([^)\s]+)\)'
replacement = '\1https://raw.githubusercontent.com/mkrtchian/mcp-auditor/v$HFPR_VERSION/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\[[^\]]*\]\()(?!https?://|#)([^)\s]+/)\)'
replacement = '\1https://github.com/mkrtchian/mcp-auditor/tree/v$HFPR_VERSION/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\[[^\]]*\]\()(?!https?://|#)([^)\s]+)\)'
replacement = '\1https://github.com/mkrtchian/mcp-auditor/blob/v$HFPR_VERSION/\2)'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Under -n, the default distribution hands out tests in fixed batches, so a worker that draws
# several slow integration tests finishes long after the rest. Work stealing rebalances them.
# Without -n it does nothing. It needs the xdist plugin loaded: run sequentially with -n 0, not
# with -p no:xdist, which rejects --dist.
# langsmith ships a pytest plugin no test uses, about a third of a second per xdist worker
addopts = "--dist worksteal -p no:langsmith_plugin"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    "ignore:Core Pydantic V1 functionality:UserWarning",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# ruff formats the Python blocks of Markdown files, and these two are immutable.
extend-exclude = ["plans", "docs/adr"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_auditor/graph/prompts.py" = ["E501"]
"src/mcp_auditor/domain/category_guidance.py" = ["E501"]
"src/mcp_auditor/cli.py" = ["E402"]
"evals/run_judge_eval.py" = ["E402"]

[tool.pyrefly]
project-includes = ["src", "evals", "tests"]
python-version = "3.13"
preset = "strict"
enabled-ignores = ["pyrefly"]
min-severity = "warn"
search-path = ["src", "."]

[tool.pyrefly.errors]
unknown-attribute-access = "error"
unknown-attribute-type = "error"
unknown-from-error = "error"
unknown-variable-type = "error"
unknown-return-type = "error"
unknown-argument-type = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
untyped-import = "error"
protected-access = "error"
untyped-function-decorator = "error"
untyped-class-decorator = "error"
untyped-namedtuple = "error"
incompatible-comparison = "error"
unnecessary-comparison = "error"
unknown-base-class = "error"
unused-ignore = "error"
