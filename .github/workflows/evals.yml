name: Evals

on:
  push:
    branches: [main]
    paths: [src/**, evals/**, tests/honeypot_server.py, tests/subtle_server.py, tests/chain_honeypot_server.py, pyproject.toml]
  pull_request:
    branches: [main]
    paths: [src/**, evals/**, tests/honeypot_server.py, tests/subtle_server.py, tests/chain_honeypot_server.py, pyproject.toml]
  workflow_dispatch:

jobs:
  judge-eval:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run judge eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m evals.run_judge_eval

  e2e-eval:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run e2e evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTY_COMPATIBLE: "1"
          TTY_INTERACTIVE: "0"
        run: uv run python -m evals.run_evals

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-eval-report
          path: |
            output/eval_report.json
            output/judged_cases.jsonl
