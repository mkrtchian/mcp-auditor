name: Eval command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  eval:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/eval') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    concurrency:
      group: eval-command-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Parse command
        id: cmd
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          first=$(printf '%s' "$BODY" | head -n1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          case "$first" in
            "/eval") echo "mode=judge" >> "$GITHUB_OUTPUT" ;;
            "/eval full") echo "mode=full" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=none" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Unknown command
        if: steps.cmd.outputs.mode == 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=confused
          gh pr comment ${{ github.event.issue.number }} \
            --body "Unrecognized command. Use \`/eval\` (judge only) or \`/eval full\` (judge + e2e)."

      - name: Acknowledge command
        if: steps.cmd.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes

      - name: Resolve PR head
        id: pr
        if: steps.cmd.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh pr view ${{ github.event.issue.number }} --json isCrossRepository,headRefOid)"
          echo "fork=$(printf '%s' "$pr" | jq -r '.isCrossRepository')" >> "$GITHUB_OUTPUT"
          echo "sha=$(printf '%s' "$pr" | jq -r '.headRefOid')" >> "$GITHUB_OUTPUT"

      - name: Refuse fork
        if: steps.pr.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=-1
          gh pr comment ${{ github.event.issue.number }} \
            --body "\`/eval\` does not run on a pull request from a fork: its code would run with the repository's API key. To evaluate it before merge, push the reviewed commit to a branch of this repository and comment \`/eval\` on a pull request from that branch."

      - name: Checkout PR head
        if: steps.cmd.outputs.mode != 'none' && steps.pr.outputs.fork == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Install uv
        if: steps.cmd.outputs.mode != 'none' && steps.pr.outputs.fork == 'false'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        if: steps.cmd.outputs.mode != 'none' && steps.pr.outputs.fork == 'false'
        run: uv python install 3.13

      - name: Install dependencies
        if: steps.cmd.outputs.mode != 'none' && steps.pr.outputs.fork == 'false'
        run: uv sync --dev

      - name: Run judge eval
        if: (steps.cmd.outputs.mode == 'judge' || steps.cmd.outputs.mode == 'full') && steps.pr.outputs.fork == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run python -m evals.run_judge_eval

      - name: Run e2e eval
        id: e2e
        if: steps.cmd.outputs.mode == 'full' && steps.pr.outputs.fork == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set +e
          uv run python -m evals.run_evals
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Report result
        if: ${{ !cancelled() && steps.cmd.outputs.mode != 'none' && steps.pr.outputs.fork == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.cmd.outputs.mode }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gate_line=""
          if [ -f output/eval_report.json ]; then
            gate="$(jq -r '.gate.mode + (if .gate.baseline_status then ", baseline " + .gate.baseline_status else "" end)' output/eval_report.json)"
            gate_line=" Gate: $gate."
          fi
          commit_line=" Commit: ${SHA:0:7}."
          if [ "${{ job.status }}" = "success" ]; then
            gh pr comment ${{ github.event.issue.number }} \
              --body "Evals passed ($MODE).$commit_line$gate_line [Run details]($run_url)"
          else
            case "$E2E_EXIT_CODE" in
              1) reason=": e2e red (regression, floor or threshold)" ;;
              3) reason=": e2e not comparable (conditions, fixtures or incomplete runs, see the log)" ;;
              4) reason=": e2e crashed (see the log)" ;;
              *) reason="" ;;
            esac
            gh pr comment ${{ github.event.issue.number }} \
              --body "Evals failed ($MODE)$reason.$commit_line$gate_line [Run details]($run_url)"
          fi
